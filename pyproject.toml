[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lofter-downloader"
version = "0.1.0"
description = "网易 LOFTER 文章下载器"
readme = "README.md"
authors = [
    {name = "developer"},
]
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = ["lofter", "crawler", "downloader"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy>=2.0",
    "aiofiles>=23.2",
    "markdownify>=0.12",
    "jinja2>=3.1",
    "websockets>=12.0",
    "cryptography>=42.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.0",
    "ruff>=0.3",
    "mypy>=1.8",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "pytest-asyncio>=0.23",
    "nox>=2024",
    "respx>=0.21",
]
docs = [
    "mkdocs>=1.6",
    "mkdocstrings[python]>=1.9",
    "mkdocs-material>=9.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "ANN", "B", "SIM", "ARG", "C4", "T10"]
ignore = [
    "ANN401",
    "ANN002",
    "ANN003",
]
per-file-ignores = {"tests/*" = ["ANN"], "src/lofter_downloader/web/server.py" = ["ANN"]}

[tool.mypy]
strict = true
python_version = "3.10"
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_unimported = false
exclude = ["tests/"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --cov=src/lofter_downloader --cov-report=term-missing --cov-report=html"

[tool.coverage.run]
source = ["lofter_downloader"]
relative_files = true
