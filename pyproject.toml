[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lofter-downloader"
version = "1.0.0"
description = "网易 LOFTER / AO3 文章下载器 — 支持 Markdown / TXT / PDF / EPUB 导出"
readme = "README.md"
authors = [{name = "developer"}]
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = ["lofter", "crawler", "downloader"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "flask==3.1.3",
    "playwright==1.60.0",
    "beautifulsoup4==4.14.3",
    "lxml==6.1.1",
    "httpx==0.28.1",
    "aiofiles==25.1.0",
    "markdownify==1.2.2",
    "fpdf2==2.8.2",
    "ebooklib==0.18",
    "pywebview==6.2.1",
    "pillow==12.2.0",
]

[project.optional-dependencies]
dev = [
    "ruff==0.15.14",
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
]

[tool.setuptools]
py-modules = ["app", "config"]

[tool.setuptools.packages.find]
include = ["downloader*", "web*"]

[tool.ruff]
line-length = 88
target-version = "py310"
src = [".", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "ANN", "B", "SIM", "ARG", "C4", "T10"]
ignore = ["ANN401", "ANN002", "ANN003"]
per-file-ignores = {"tests/*" = ["ANN"]}

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v"
